# Weekly update PRs for npm packages and the pinned GitHub Actions.
# Minor and patch bumps are grouped to keep the noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tailwind 4 is a different setup (CSS-first config, @tailwindcss/postcss),
      # so it gets a deliberate migration PR rather than a version bump
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
